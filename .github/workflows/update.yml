name: Update FPL data

on:
  schedule:
    # Every hour. Cheap and safe to run more/less often -- change the
    # cron expression below. The pipeline is incremental (only newly
    # finished gameweeks trigger the expensive calls), so frequency
    # mainly affects how fresh the live/in-progress gameweek looks.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run update
        run: python scripts/update.py

      - name: Commit and push if data changed
        run: |
          git config user.name "sportz-chat-fpl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update FPL data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
